<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2ab97a" />
  <title>Offline | Velocity Turf</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0e161a;
      color: #f3f5f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: rgba(23, 33, 38, 0.7);
      border: 1px solid rgba(42, 185, 122, 0.25);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #d4ff4f;
      background: rgba(212, 255, 79, 0.12);
      border: 1px solid rgba(212, 255, 79, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #d4ff4f;
      border-radius: 50%;
      box-shadow: 0 0 10px #d4ff4f;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(42, 185, 122, 0.2), rgba(212, 255, 79, 0.05));
      border: 1px solid rgba(42, 185, 122, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrapper svg {
      width: 42px;
      height: 42px;
      stroke: #2ab97a;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(243, 245, 241, 0.7);
      margin-bottom: 28px;
    }
    .btn-retry {
      background: #2ab97a;
      color: #0e161a;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(42, 185, 122, 0.35);
    }
    .btn-retry:hover {
      background: #24a46c;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(42, 185, 122, 0.45);
    }
    .status-text {
      font-size: 13px;
      color: rgba(243, 245, 241, 0.5);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="badge">
      <span class="pulse-dot"></span>
      Connection Paused
    </div>

    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p>Velocity Turf requires an active connection to fetch real-time turf slots and bookings. Check your network or Wi-Fi to jump back in.</p>

    <button class="btn-retry" onclick="handleRetry()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Reconnect Now
    </button>

    <div id="status" class="status-text">Waiting for network connectivity...</div>
  </div>

  <script>
    function handleRetry() {
      const status = document.getElementById('status');
      status.textContent = 'Checking connectivity...';
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          status.textContent = 'Still offline. Please check your internet connection.';
        }, 1000);
      }
    }

    window.addEventListener('online', () => {
      document.getElementById('status').textContent = 'Network detected! Reconnecting...';
      setTimeout(() => window.location.reload(), 800);
    });
  </script>
</body>
</html>
