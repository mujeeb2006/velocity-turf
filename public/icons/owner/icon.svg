<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <clipPath id="vt-clip-owner">
      <rect x="0" y="0" width="512" height="512" rx="120" />
    </clipPath>
    <linearGradient id="vt-bg-owner" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0E7050" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#vt-bg-owner)" />
  <g clip-path="url(#vt-clip-owner)">
    <!-- Sport turf background stripes -->
    <rect x="0" y="0" width="128" height="512" fill="#0B6647" opacity="0.35" />
    <rect x="128" y="0" width="128" height="512" fill="#0E7050" opacity="0.2" />
    <rect x="256" y="0" width="128" height="512" fill="#0B6647" opacity="0.35" />
    <rect x="384" y="0" width="128" height="512" fill="#0E7050" opacity="0.2" />

    <!-- Velocity chevron V -->
    <path d="M100 130h90l66 160 66-160h90l-114 260h-84L100 130Z" fill="#FFFFFF" />

    <!-- Speed streaks -->
    <path d="M140 100h110M170 120h80" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7" />

    <!-- Glowing accent sports ball -->
    <circle cx="380" cy="100" r="32" fill="#C8F542" />
    <circle cx="380" cy="100" r="10" fill="#064E3B" />

    <!-- Role pill badge -->
    <rect x="126" y="416" width="260" height="58" rx="29" fill="#C8F542" />
    <text x="256" y="454" font-family="'Manrope', sans-serif" font-size="26" font-weight="900" fill="#064E3B" text-anchor="middle" letter-spacing="3">OWNER</text>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="118" stroke="#C8F542" stroke-opacity="0.4" stroke-width="4" />
</svg>