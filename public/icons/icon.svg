    <rect x="0" y="0" width="60" height="240" fill="#1EA660" opacity="0.25" />
    <rect x="60" y="0" width="60" height="240" fill="#159B57" opacity="0.1" />
    <rect x="120" y="0" width="60" height="240" fill="#1EA660" opacity="0.25" />
    <rect x="180" y="0" width="60" height="240" fill="#0F7F4B" opacity="0.25" />
    
    <!-- Speed streaks -->
    <path d="M72 48h54M84 62h38" stroke="#D9FBE9" stroke-width="6" stroke-linecap="round" opacity="0.95" />
    
    <!-- Neon Volt Speed Ball with inner core -->
